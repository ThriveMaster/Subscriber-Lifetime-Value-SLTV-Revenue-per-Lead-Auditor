<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscriber Lifetime Value (SLTV) & Revenue-per-Lead Auditor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-zinc-50 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 min-h-screen p-6">

    <div class="max-w-6xl mx-auto bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-2xl shadow-2xl overflow-hidden">
        
        <!-- Header -->
        <div class="bg-gradient-to-r from-teal-700 via-emerald-600 to-indigo-700 p-6 text-white">
            <h1 class="text-2xl font-extrabold tracking-tight">Subscriber Lifetime Value (SLTV) Auditor</h1>
            <p class="text-teal-100 text-sm mt-1">Move beyond vanity metrics. Calculate the true economic worth of your email list.</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 divide-y lg:divide-y-0 lg:divide-x divide-zinc-200 dark:divide-zinc-800">
            
            <!-- Inputs -->
            <div class="p-6 lg:col-span-5 flex flex-col gap-6 bg-zinc-50/50 dark:bg-zinc-900/40">
                <div class="space-y-4">
                    <div>
                        <label class="text-xs font-bold text-zinc-400 uppercase tracking-wider">Total Active Subscribers</label>
                        <input type="number" id="input-subs" value="10000" class="w-full mt-2 bg-white dark:bg-zinc-800 border border-zinc-700 rounded-lg p-3 font-bold outline-none focus:ring-2 focus:ring-teal-500">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-zinc-400 uppercase tracking-wider">Total Annual Email Revenue ($)</label>
                        <input type="number" id="input-rev" value="150000" class="w-full mt-2 bg-white dark:bg-zinc-800 border border-zinc-700 rounded-lg p-3 font-bold outline-none focus:ring-2 focus:ring-teal-500">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-zinc-400 uppercase tracking-wider">Annual Churn Rate (%)</label>
                        <input type="range" id="slider-churn" min="5" max="50" value="20" class="w-full mt-3 accent-teal-600">
                        <div class="flex justify-between text-xs text-zinc-500 mt-1">
                            <span>5% (Sticky)</span>
                            <span id="val-churn" class="font-bold text-teal-600">20% (Avg)</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="p-6 lg:col-span-7 bg-white dark:bg-zinc-900 flex flex-col gap-6">
                <div class="grid grid-cols-2 gap-4">
                    <div class="p-4 bg-zinc-100 dark:bg-zinc-800 rounded-xl border border-zinc-200 dark:border-zinc-700">
                        <span class="text-[10px] font-bold text-zinc-500 uppercase">Annual Revenue per Subscriber</span>
                        <div id="stat-rps" class="text-3xl font-extrabold text-teal-600 mt-1">$0</div>
                    </div>
                    <div class="p-4 bg-zinc-100 dark:bg-zinc-800 rounded-xl border border-zinc-200 dark:border-zinc-700">
                        <span class="text-[10px] font-bold text-zinc-500 uppercase">Estimated Lifetime Value (LTV)</span>
                        <div id="stat-ltv" class="text-3xl font-extrabold text-indigo-600 mt-1">$0</div>
                    </div>
                </div>
                <div class="h-48 w-full"><canvas id="ltv-chart"></canvas></div>
                <div id="audit-feedback" class="p-4 rounded-xl border border-zinc-200 bg-zinc-50 text-xs text-zinc-600 dark:bg-zinc-800 dark:border-zinc-700 dark:text-zinc-300 italic"></div>
                <button id="btn-copy" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold rounded-xl py-3 shadow-lg transition-all">Copy LTV Audit Report</button>
            </div>
        </div>
    </div>
<div align="center">Powered by <a href="https://thrive.productions" target="_blank"><img src="img/logo.png"></a></div>
    <script>
        const inputSubs = document.getElementById("input-subs");
        const inputRev = document.getElementById("input-rev");
        const sliderChurn = document.getElementById("slider-churn");
        
        const statRps = document.getElementById("stat-rps");
        const statLtv = document.getElementById("stat-ltv");
        const feedback = document.getElementById("audit-feedback");
        let chart = null;

        const calculate = () => {
            const subs = parseFloat(inputSubs.value) || 0;
            const rev = parseFloat(inputRev.value) || 0;
            const churn = parseFloat(sliderChurn.value) / 100;
            
            document.getElementById("val-churn").textContent = `${(churn * 100).toFixed(0)}%`;

            const rps = subs > 0 ? (rev / subs) : 0;
            // Simplified LTV formula = (Revenue per Year) / (Churn Rate)
            const ltv = churn > 0 ? (rps / churn) : 0;

            statRps.textContent = `$${rps.toFixed(2)}`;
            statLtv.textContent = `$${ltv.toFixed(0)}`;

            feedback.innerHTML = ltv > 100 
                ? `<strong>High-Equity List:</strong> With an LTV of <strong>$${ltv.toFixed(0)}</strong>, your list is a significant business asset. You can confidently invest more into your growth (ads, partnerships) to acquire new leads, as the long-term return is high.`
                : `<strong>Retention Warning:</strong> Your subscriber LTV is currently <strong>$${ltv.toFixed(0)}</strong>. Focus on increasing subscriber lifetime through better retention, or raise the lifetime value of your products to ensure your list growth is sustainably profitable.`;

            renderChart(rps, ltv);
        };

        const renderChart = (rps, ltv) => {
            const ctx = document.getElementById("ltv-chart").getContext("2d");
            if (chart) chart.destroy();
            chart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Value per Year', 'Estimated LTV'],
                    datasets: [{ data: [rps, ltv], backgroundColor: ['#0d9488', '#4f46e5'] }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        };

        [inputSubs, inputRev, sliderChurn].forEach(el => el.addEventListener("input", calculate));
        document.getElementById("btn-copy").addEventListener("click", () => {
            navigator.clipboard.writeText(`Subscriber LTV Audit:\nAnnual Value/Sub: ${statRps.textContent}\nEstimated LTV: ${statLtv.textContent}\n\n${feedback.innerText}`);
            triggerToast("LTV report copied!");
        });
        
        function triggerToast(msg) {
            const toast = document.createElement("div");
            toast.className = "fixed bottom-5 right-5 bg-emerald-600 text-white font-medium px-4 py-3 rounded-xl shadow-xl z-50 transition-all";
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        calculate();
    </script>
</body>
</html>
